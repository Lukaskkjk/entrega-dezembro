<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="img/png" href="img/favicoin.jpg">
    <title>Login Urbanis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-login">
    <header class="logo">
        <img src="img/logo-grande.png" alt="logo Urbanis">
    </header>
    <main class="cadastro-site">
        <h1>Acesse sua conta</h1>
        <form>
            <h2 class="title-login">Digite seu e-mail e senha</h2>
            <input class="email-login" type="email" placeholder="Digite seu e-mail">
            <input class="password-login" type="password" placeholder="Digite sua senha">
            <button class="entrar-login" type="submit">Entrar</button>
        </form>
        <a href="#">Esqueci minha senha</a>
        <p>Não tem conta?</p>
        <a href="perfil.html">Cadastrar-se</a>
    </main>
</body>
</html>
