<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Urbanis</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body class="pagina-cadastro">
    <header class="logo-cadastro">
        <img src="img/logo-grande.png" alt="Logo Urbanis">
    </header>
    <main class="cadastro-usuario">
        <h1>Crie sua conta</h1>
        <h2>Preencha seus dados</h2>
        <form action="perfil.html">
            <label>Nome completo</label>
            <input type="text" placeholder="Digite seu nome completo" required>
            <label>CPF</label>
            <input type="text" placeholder="Digite seu CPF" required>
            <label>Data de nascimento</label>
            <input type="date" required>
            <label>Telefone</label>
            <input type="tel" placeholder="(00) 00000-0000" required>
            <label>E-mail</label>
            <input type="email" placeholder="Digite seu e-mail" required>
            <label>Senha</label>
            <input type="password" placeholder="Crie uma senha" required>
            <label>Confirmar senha</label>
            <input type="password" placeholder="Digite sua senha novamente" required>
            <h2 class="titulo-endereco">Endereço</h2>
            <label>CEP</label>
            <input type="text" placeholder="Digite seu CEP" required>
            <label>Rua</label>
            <input type="text" placeholder="Nome da rua" required>
            <label>Número</label>
            <input type="text" placeholder="Número da residência" required>
            <label>Bairro</label>
            <input type="text" placeholder="Digite seu bairro" required>
            <label>Cidade</label>
            <input type="text" placeholder="Digite sua cidade" required>
            <label>Estado</label>
            <input type="text" placeholder="Digite seu estado" required>
            <button type="submit">Cadastrar</button>
        </form>
        <p>Já possui uma conta?</p>
        <a href="login.html">Fazer login</a>
    </main>
</body>
</html>
